name: Smoke test deployment

on:
  deployment_status:

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Show what Vercel sent (delete after the first run)
        env:
          STATE: ${{ github.event.deployment_status.state }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          ENV_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          echo "state=$STATE"
          echo "environment=$ENVIRONMENT"
          echo "environment_url=$ENV_URL"
          echo "target_url=$TARGET_URL"
      - name: Check the deployed page
        env:
          URL: ${{ github.event.deployment_status.environment_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Checking $URL"
          code=$(curl -sS -o page.html -w "%{http_code}" --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "x-vercel-protection-bypass: $BYPASS" "$URL")
          echo "HTTP $code"
          test "$code" = "200"
          grep -q "Railway Radar" page.html