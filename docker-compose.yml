# Local infrastructure for development (Redis for live train positions).
# Start: pnpm infra:up      Stop: pnpm infra:down
# Redis is reachable at localhost:6379 from this computer only.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      