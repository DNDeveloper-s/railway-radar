name: PR Quality Gate

on:
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Enterprise Guardrails
        # This single command tells Turbo to run linting, typescript checking, 
        # and testing across all apps and packages in the monorepo concurrently.
        run: pnpm turbo run lint typecheck test